<script>(function(){WEB.chrome("policies.html");
var esc=WEB.esc,q=new URLSearchParams(location.search).get("p")||"";
function fmt(t){return String(t||"").split(/\n\s*\n/).map(function(b){b=b.trim();if(!b)return"";if(/^## /.test(b))return '<h2>'+esc(b.slice(3))+'</h2>';return '<p>'+esc(b).replace(/\n/g,"<br>")+'</p>'}).join("")}
(async function(){var B=document.getElementById("body");if(!WEB.db){B.innerHTML="<p>This page is not available yet.</p>";return}
  var r=await WEB.db.rpc("site_policy",{p_slug:q});var p=r.data||{};if(p.error||!p.title){B.innerHTML="<p>We could not find that policy. See <a href='policies.html'>all policies</a>.</p>";return}
  document.title=p.title+" | Franksomi Solution Ltd";document.querySelector(".shophead h1").textContent=p.title;
  B.innerHTML=fmt(p.body)+'<p style="color:var(--mut);font-size:.85rem">Last updated '+esc(String(p.updated_at||"").slice(0,10))+'</p>'})();
})();</script>
