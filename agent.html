<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent statement | Franksomi Solution Ltd</title><meta name="description" content="Franksomi referral agents: see your leads and commission."><meta name="theme-color" content="#0E1726">
<link rel="icon" href="media/emblem.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap"><link rel="stylesheet" href="web.css">
<link rel="manifest" href="site.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body><a class="skip" href="#main">Skip to content</a><div id="siteHeader"></div>
<section class="shophead"><div class="wrap"><span class="kicker">Referral agents</span><h1 style="font-size:clamp(1.8rem,5vw,2.6rem)">Your agent statement</h1><p>Enter your referral code and the phone number we have for you to see your customers and commission.</p></div></section>
<main id="main" class="wrap" style="padding:30px 18px 70px;max-width:820px">
  <form class="card noprint" id="f"><div class="trackbox" style="margin-top:0"><input name="code" placeholder="Your referral code" required aria-label="Referral code" autocomplete="off" style="text-transform:uppercase"><input name="phone" type="tel" placeholder="Your phone number" required aria-label="Phone number" autocomplete="tel"><button class="btn" type="submit">Show</button></div><p class="msg bad" id="err" role="alert" style="margin:10px 0 0"></p></form>
  <div id="out" hidden></div>
</main>
<div id="siteFooter"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="web.js"></script>
<script>
(function(){
  var E=WEB.esc,K=WEB.kes,$=WEB.$;WEB.chrome("shop.html");
  var rule=function(a){return a.mode==="percent"?K(a.rate)+"% of each sale":a.mode==="profit"?K(a.rate)+"% of the profit on each sale":"Tiered: the rate rises with the month's "+(a.basis==="profit"?"profit":"sales")+" ("+(a.tiers||[]).map(function(t){return K(t.rate)+"% from KES "+K(t.from)}).join(", ")+")"};
  $("#f").onsubmit=async function(e){e.preventDefault();var f=e.target,err=$("#err");err.textContent="";$("#out").hidden=true;
    if(!WEB.db){err.textContent="This page is not switched on yet. Please call 0711 952 924.";return}
    var b=f.querySelector("button");b.disabled=true;
    var r=await WEB.db.rpc("agent_statement",{p_code:f.code.value,p_phone:f.phone.value});b.disabled=false;var a=r.data||{};
    if(r.error||!a.ok){err.textContent=a.error==="too_many"?"Too many tries. Please try again later or call us.":"We could not find that agent. Check the code and the phone number we have for you.";return}
    var link=location.origin+location.pathname.replace(/[^\/]*$/,"")+"shop.html?ref="+encodeURIComponent(a.code);
    $("#out").innerHTML='<div class="card"><h3 style="margin-top:0">Hello '+E(a.name.split(" ")[0])+'</h3><p>Your referral code is <b style="font-size:1.3em;letter-spacing:.06em">'+E(a.code)+'</b><br>Commission: '+E(rule(a))+'</p>'+
      '<div class="sumrow"><span>Customers you brought</span><b>'+Number(a.customers)+'</b></div><div class="sumrow"><span>Sales through you</span><b>KES '+K(a.sales)+'</b></div><div class="sumrow"><span>Commission owed to you</span><b>KES '+K(a.owed)+'</b></div><div class="sumrow t"><span>Commission paid to you</span><b>KES '+K(a.paid)+'</b></div>'+
      '<p style="color:var(--mut)"><small>Your link to share: <br><span style="word-break:break-all">'+E(link)+'</span></small></p></div>'+
      '<div class="card" style="margin-top:16px"><h3 style="margin-top:0">Recent sales</h3>'+((a.recent||[]).length?'<div class="tablewrap"><table><thead><tr><th>Date</th><th>Reference</th><th style="text-align:right">Sale</th><th style="text-align:right">Your commission</th><th>Status</th></tr></thead><tbody>'+a.recent.map(function(x){return '<tr><td>'+E(x.on)+'</td><td>'+E(x.ref||"")+'</td><td style="text-align:right">'+K(x.revenue)+'</td><td style="text-align:right">'+K(x.amount)+'</td><td>'+(x.status==="Paid"?"Paid":"Owed")+'</td></tr>'}).join("")+'</tbody></table></div>':'<p>No sales yet. Share your code or link with customers. Commission is added when their order, repair or job is complete and paid.</p>')+'</div>';
    if(a.prices){$("#out").insertAdjacentHTML("afterbegin",'<div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">Check a price</h3><input id="pq" type="search" placeholder="Type an item or service, e.g. keyboard" aria-label="Item or service to price" autocomplete="off" style="width:100%"><div id="pr" style="margin-top:10px"></div></div>');
      var tm=0,code=f.code.value,phone=f.phone.value;$("#pq").oninput=function(){clearTimeout(tm);var q=this.value;tm=setTimeout(async function(){var box=$("#pr");if(q.trim().length<2){box.innerHTML="";return}
        var x=await WEB.db.rpc("agent_price_search",{p_code:code,p_phone:phone,p_q:q});var d=x.data||{};
        if(x.error||!d.ok){box.innerHTML='<p style="color:#b42318">'+(d.error==="too_many"?"Slow down a little, then try again.":"Price check is not available for you right now.")+'</p>';return}
        box.innerHTML=(d.items||[]).length?'<div class="tablewrap"><table><thead><tr><th>Item</th><th style="text-align:right">Price (KES)</th><th>Stock</th></tr></thead><tbody>'+d.items.map(function(i){return '<tr><td>'+E(i.name)+(i.unit?' <small>per '+E(i.unit)+'</small>':'')+'</td><td style="text-align:right"><b>'+K(i.price)+'</b></td><td>'+(i.kind==="Service"?"":i.in_stock?"In stock":"Ask us")+'</td></tr>'}).join("")+'</tbody></table></div>':'<p>Nothing found. Call us on 0711 952 924.</p>'},300)}}
    $("#out").hidden=false};
})();
</script>
</body></html>
